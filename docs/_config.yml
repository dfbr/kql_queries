title: The work in front of me
description: Aide memoire for what I've done in work.
url: "https://work.dfbr.co.uk"
baseurl: ""
lang: en-GB

markdown: kramdown
permalink: /:categories/:title/

theme: null
plugins:
  - jekyll-feed
  - jekyll-seo-tag

collections:
  notes:
    output: true
    permalink: /notes/:path/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: notes
    values:
      layout: post
  - scope:
      path: ""
    values:
      layout: default

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor

# Home page shows `first_page` entries; /page/2/ onwards show `per_page`.
# Stub pages are generated by scripts/generate-pagination.sh during the build.
pagination:
  first_page: 5
  per_page: 10
