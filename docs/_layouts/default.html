<!doctype html>
<html lang="{{ site.lang | default: 'en-US' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% seo %}
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    {% feed_meta %}
  </head>
  <body>
    <header class="site-header">
      <div class="shell header-inner">
        <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
        <nav aria-label="Primary navigation">
          <a href="{{ '/' | relative_url }}">Notes</a>
          <a href="{{ '/about/' | relative_url }}">About</a>
        </nav>
      </div>
    </header>

    <main class="shell">
      {{ content }}
    </main>

    <footer class="site-footer">
      <div class="shell footer-inner">
        <span>{{ site.title }}</span>
      </div>
    </footer>

    {% if content contains 'language-mermaid' %}
    <script type="module">
      import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.esm.min.mjs";

      // Kramdown/Rouge renders ```mermaid fences as highlighted code blocks;
      // swap each one for the <pre class="mermaid"> element Mermaid expects.
      document.querySelectorAll("div.language-mermaid, pre > code.language-mermaid").forEach((block) => {
        const container = block.matches("code") ? block.parentElement : block;
        const diagram = document.createElement("pre");
        diagram.className = "mermaid";
        diagram.textContent = container.textContent;
        container.replaceWith(diagram);
      });

      mermaid.initialize({ startOnLoad: false, theme: "neutral" });
      await mermaid.run({ querySelector: "pre.mermaid" });
    </script>
    {% endif %}
  </body>
</html>
