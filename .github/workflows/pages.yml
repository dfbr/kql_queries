name: Deploy Jekyll site to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  # Daily rebuild at 06:00 London time so future-dated posts go live on their date.
  # Cron is UTC-only, so both candidates are scheduled and the check job picks the
  # one matching the current UK offset (05:00 UTC in BST, 06:00 UTC in GMT).
  schedule:
    - cron: '0 5 * * *'
    - cron: '0 6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.tz.outputs.run }}
    steps:
      - id: tz
        env:
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT" != "schedule" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          offset=$(TZ=Europe/London date +%z)
          if { [ "$offset" = "+0100" ] && [ "$CRON" = "0 5 * * *" ]; } || \
             { [ "$offset" = "+0000" ] && [ "$CRON" = "0 6 * * *" ]; }; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: check
    if: needs.check.outputs.run == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Generate pagination pages
        run: ./scripts/generate-pagination.sh docs
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
